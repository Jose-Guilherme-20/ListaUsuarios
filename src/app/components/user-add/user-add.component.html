<h2 mat-dialog-title>Novo Usuário</h2>

<mat-dialog-content [formGroup]="form">
  <mat-tab-group>
    <!-- TAB 1 -->
    <mat-tab label="Dados do Usuário">
      <div class="tab-content">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" placeholder="nome" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Idade</mat-label>
          <input
            matInput
            type="number"
            formControlName="idade"
            placeholder="idade"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Telefone</mat-label>
          <input matInput formControlName="telefone" placeholder="telefone" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Profissão</mat-label>
          <input
            matInput
            formControlName="profissao"
            placeholder=" profissao"
          />
        </mat-form-field>
      </div>
    </mat-tab>

    <!-- TAB 2 -->
    <mat-tab label="Endereço">
      <div formGroupName="endereco" class="tab-content">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Rua</mat-label>
          <input matInput formControlName="rua" placeholder="rua" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Número</mat-label>
          <input
            matInput
            type="text"
            formControlName="numero"
            placeholder="numero"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Cidade</mat-label>
          <input matInput formControlName="cidade" placeholder="cidade" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Bairro</mat-label>
          <input matInput formControlName="bairro" placeholder="bairro" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Complemento</mat-label>
          <input
            matInput
            formControlName="complemento"
            placeholder="complemento"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Estado</mat-label>
          <input matInput formControlName="estado" placeholder="estado" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>CEP</mat-label>
          <input matInput formControlName="cep" placeholder="cep" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>País</mat-label>
          <input matInput formControlName="pais" placeholder="pais" />
        </mat-form-field>
      </div>
    </mat-tab>
  </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="salvar()">Salvar</button>
</mat-dialog-actions>
